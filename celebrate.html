  <script>
    // 1. 꽃가루 & 축하 컨페티 애니메이션
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const colors = [
      '#ff6b9d', '#ffd43b', '#4dabf7', '#69db7c',
      '#b197fc', '#ff922b', '#ff8787', '#f783ac'
    ];

    const particles = [];

    function createParticle(fromSide = null) {
      const isPetal = Math.random() < 0.45;
      let x, y, vx, vy;

      if (fromSide === 'left') {
        x = 0;
        y = height * (0.4 + Math.random() * 0.4);
        vx = 4 + Math.random() * 8;
        vy = -(6 + Math.random() * 8);
      } else if (fromSide === 'right') {
        x = width;
        y = height * (0.4 + Math.random() * 0.4);
        vx = -(4 + Math.random() * 8);
        vy = -(6 + Math.random() * 8);
      } else {
        x = Math.random() * width;
        y = -20 - Math.random() * height * 0.4;
        vx = (Math.random() - 0.5) * 2.2;
        vy = 1.6 + Math.random() * 2.4;
      }

      return {
        x,
        y,
        vx,
        vy,
        size: 6 + Math.random() * 8,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.14,
        swayOffset: Math.random() * Math.PI * 2,
        isPetal,
        burst: Boolean(fromSide)
      };
    }

    function launchFanfareBurst() {
      for (let i = 0; i < 45; i++) {
        particles.push(createParticle('left'));
        particles.push(createParticle('right'));
      }
    }

    // 초기 꽃가루 세팅 + 팡파레 발사
    for (let i = 0; i < 90; i++) {
      const p = createParticle();
      p.y = Math.random() * height;
      particles.push(p);
    }
    launchFanfareBurst();

    function animateConfetti() {
      ctx.clearRect(0, 0, width, height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.swayOffset += 0.04;
        p.x += p.vx + Math.sin(p.swayOffset) * 0.7;
        p.y += p.vy;
        p.rotation += p.rotSpeed;

        if (p.burst) {
          p.vy += 0.16; // 중력
          p.vx *= 0.99;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;

        if (p.isPetal) {
          // 꽃잎 모양
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size * 0.75, p.size * 0.42, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // 반짝이 종이 조각
          ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.6);
        }
        ctx.restore();

        if (p.y > height + 30) {
          if (p.burst && particles.length > 110) {
            particles.splice(i, 1);
          } else {
            particles[i] = createParticle();
          }
        }
      }

      requestAnimationFrame(animateConfetti);
    }
    animateConfetti();

    // 2. Web Audio API 축하 팡파레 사운드
    let audioCtx = null;

    function playFanfareSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        // C5 - E5 - G5 - C6 팡파레 멜로디 + 화음
        const notes = [
          { freq: 523.25, start: 0.0, dur: 0.14 },
          { freq: 659.25, start: 0.14, dur: 0.14 },
          { freq: 783.99, start: 0.28, dur: 0.14 },
          { freq: 1046.50, start: 0.44, dur: 0.55 },
          // 마지막 화음
          { freq: 523.25, start: 0.44, dur: 0.55 },
          { freq: 659.25, start: 0.44, dur: 0.55 },
          { freq: 783.99, start: 0.44, dur: 0.55 }
        ];

        notes.forEach(({ freq, start, dur }) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + start);

          gain.gain.setValueAtTime(0.001, now + start);
          gain.gain.exponentialRampToValueAtTime(0.14, now + start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + start);
          osc.stop(now + start + dur + 0.02);
        });
      } catch (e) {
        // 오디오 재생이 차단되어도 화면 동작에는 영향 없음
      }
    }

    // 페이지 진입 시 자동 재생 시도
    window.addEventListener('DOMContentLoaded', () => {
      playFanfareSound();
    });

    document.getElementById('replay-fanfare-btn').addEventListener('click', () => {
      launchFanfareBurst();
      playFanfareSound();
    });
  </script>
